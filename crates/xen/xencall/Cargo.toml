[package]
name = "krata-xencall"
version = "0.0.24"
edition = "2021"
description = "An implementation of direct interfacing to Xen privcmd for krata"
license = "GPL-2.0-or-later"

[lib]
name = "xencall"

[dependencies]
libc = "0.2"
log = "0.4.22"
nix = { version = "0.29.0", features = ["ioctl"] }
thiserror = "2.0.9"
tokio = { version = "1.41.1", features = ["full"] }
